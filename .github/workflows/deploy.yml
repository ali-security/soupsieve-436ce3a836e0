name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --upgrade build
          pip install hatchling==1.14.0
          # hatchling 1.14.0's plugin/utils.py does `import importlib` but then calls
          # `importlib.util.spec_from_file_location` when loading this project's custom
          # metadata hook (hatch_build.py). That only worked because setuptools' startup
          # .pth shim happened to import importlib.util; modern environments no longer do,
          # so the backend subprocess dies with
          # "AttributeError: module 'importlib' has no attribute 'util'".
          # hatchling must stay pinned at exactly 1.14.0 because that version string is
          # written verbatim into the wheel's WHEEL metadata as "Generator: hatchling 1.14.0",
          # which has to match the public PyPI wheel byte-for-byte -- so we cannot upgrade.
          # Instead, pre-import importlib.util at interpreter startup via a sitecustomize.py
          # on PYTHONPATH, so it is already in sys.modules inside the build backend subprocess.
          mkdir -p "$RUNNER_TEMP/buildhook"
          echo 'import importlib.util  # noqa: F401' > "$RUNNER_TEMP/buildhook/sitecustomize.py"
          PYTHONPATH="$RUNNER_TEMP/buildhook" python -m build -s -w --no-isolation
      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
